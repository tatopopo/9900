name: Build Right Arm Totem Mod 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get mod files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        run: gradle build

      - name: Save finished mod
        uses: actions/upload-artifact@v4
        with:
          name: Right-Arm-Totem-Mod-1.21.1
          path: build/libs/right-arm-totem-1.0.0.jar
